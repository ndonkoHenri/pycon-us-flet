# Open a deep link to ROUTE, as a tap on a link in another app does (D-21, D-269).
#
# env:
#   ROUTE  the route path, from its first slash: "/schedule/session/31"
#   LINK   the link's scheme and host, given to the run (`-e LINK=confcompanion://app`).
#          Default: the one below, which must equal `[tool.flet.deep_linking]` in
#          pyproject.toml; tests/test_deep_link_flow.py checks that it does, so a
#          rename there fails the check rather than this flow.
#
# The first link on a simulator asks "Open in …?" (F31): tap Open when it shows.
appId: io.github.ndonkohenri.confcompanion
---
- openLink: ${(LINK || 'confcompanion://app') + ROUTE}
- runFlow:
    when:
      platform: iOS
      visible: Open
    commands:
      - tapOn: Open
