# Launch the app as a fresh install starts: no settings, no favourites, no cache,
# Developer options locked, real time and the year's feed (D-73). Maestro clears the
# app's data first (`pm clear` on Android, the app's container on iOS), and grants every
# permission. On Android that includes notifications, so a star shows no reminders
# primer (D-395); on the iOS simulator it does not, so a flow's first star runs
# primer_not_now.yaml (#710).
appId: io.github.ndonkohenri.confcompanion
---
- launchApp:
    clearState: true
    stopApp: true
- runFlow: get_started.yaml
