# Open Developer options from a tab root, as a person would (D-73, D-187), as
# tests/ui/developer.py's open_developer() does: More › About this app › the version
# row 7 times › Developer options. Once unlocked, the version taps are skipped.
# Unlike a flet test flow, Maestro can scroll, so About this app is reached on any
# phone size (the iPhone 17 hides it under the bar).
appId: io.github.ndonkohenri.pyconus
---
- runFlow:
    file: tab.yaml
    env:
      TAB: more
      NAME: "More.*Tab 5 of 5"
- extendedWaitUntil:
    visible:
      id: more.title
    timeout: 15000
- scrollUntilVisible:
    element:
      id: more.app
    direction: DOWN
- tapOn:
    id: more.app
- extendedWaitUntil:
    visible:
      id: about_app.version
    timeout: 15000
# At 200 % text the version row and Developer options sit below the fold (#458).
- scrollUntilVisible:
    element:
      id: about_app.version
    direction: DOWN
- runFlow:
    when:
      notVisible:
        id: about_app.developer
    commands:
      - tapOn:
          id: about_app.version
          repeat: 7
          delay: 150
- scrollUntilVisible:
    element:
      id: about_app.developer
    direction: DOWN
- tapOn:
    id: about_app.developer
- extendedWaitUntil:
    visible:
      id: developer.fake_clock
    timeout: 15000
