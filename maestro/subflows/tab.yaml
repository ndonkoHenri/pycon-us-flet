# Go to a tab's root from the bar on a phone or the rail from 600 dp (a tablet).
#
# env:
#   TAB   the tab's key in its bar identifier, app.nav.<TAB>: now, schedule,
#         my_schedule, map, more
#   NAME  the destination's name as a regular expression, "More.*Tab 5 of 5": the rail's
#         destinations have no identifier (D-277, #163), so there the flow finds one by
#         its name, as a screen reader reads it
#
# The bar's identifier comes first; the name only where no identifier shows (#456).
appId: io.github.ndonkohenri.confcompanion
---
- runFlow:
    when:
      visible:
        id: app.nav.${TAB}
    commands:
      - tapOn:
          id: app.nav.${TAB}
- runFlow:
    when:
      notVisible:
        id: app.nav.${TAB}
    commands:
      - tapOn:
          text: ${NAME}
