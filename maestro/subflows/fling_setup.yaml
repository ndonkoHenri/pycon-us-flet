# The start of #346's row D: fresh and offline, the fake clock at Friday 2026-05-15 14:01
# (so the now slot stays 2:00 PM for about half an hour), on the Schedule with the now
# slot at the top. regression/fling_after_sheet.yaml runs it first; tools/fling_after_sheet.py
# runs it on its own (`maestro test`), then drives the trials through adb, so it leaves
# airplane mode on: the flow's onFlowComplete, or the driver, turns it off.
appId: io.github.ndonkohenri.confcompanion
---
- runFlow:
    file: start_offline.yaml
    env:
      NOW: 2026-05-15 14:01
- tapOn:
    id: app.nav.schedule
- extendedWaitUntil:
    visible:
      id: schedule.session.138
    timeout: 15000
- waitForAnimationToEnd
