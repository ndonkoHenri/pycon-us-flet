# NOTIF-01, STORE-10, NOTIF-10 (#449, D-401): Settings › Reminders, live in a packaged
# build (E3), and My schedule's Reminder settings.
#
# A fresh install with every permission granted (subflows/launch_fresh.yaml), so the
# OS allows notifications and the session switch shows no primer (D-395).
# - More › Settings: session reminders off, no lead, the three moments on.
# - The switch on: the 5 · 10 · 15 min lead shows at 10; pick 15. On Android, where
#   Alarms & reminders is off for a fresh install, its card shows; never on iOS.
# - A relaunch: the switch still on, 15 still picked (each platform says a selected
#   segment its own way: Android's `checked`, iOS's `selected`).
# - My schedule › More options › Reminder settings: Settings over My schedule; Back
#   returns to My schedule.
# - The switch off again, so a second run starts the same way.
appId: io.github.ndonkohenri.pyconus
name: Session reminders at 15 min, held after a relaunch
tags:
  - journeys
  - reminders
---
- runFlow: ../subflows/launch_fresh.yaml
- runFlow: ../subflows/theme_settings.yaml
- scrollUntilVisible:
    element:
      id: settings.reminders.sessions
    direction: DOWN
- assertNotVisible:
    id: settings.reminders.lead.10
- assertVisible:
    id: settings.reminders.keynote
- takeScreenshot: reminders-01-off

# On: the lead shows, at 10; then 15.
- tapOn:
    id: settings.reminders.sessions
- extendedWaitUntil:
    visible:
      id: settings.reminders.lead.15
    timeout: 15000
- tapOn:
    id: settings.reminders.lead.15
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: settings.reminders.exact
          timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - assertNotVisible:
          id: settings.reminders.exact
- takeScreenshot: reminders-02-on-15

# The relaunch: still on, at 15.
- runFlow: ../subflows/relaunch.yaml
- runFlow: ../subflows/theme_settings.yaml
- scrollUntilVisible:
    element:
      id: settings.reminders.lead.15
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: settings.reminders.sessions
          checked: true
      - assertVisible:
          id: settings.reminders.lead.15
          checked: true
      - assertVisible:
          id: settings.reminders.lead.10
          checked: false
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: settings.reminders.sessions
          text: "1"
      - assertVisible:
          id: settings.reminders.lead.15
          selected: true
      - assertVisible:
          id: settings.reminders.lead.10
          selected: false
- takeScreenshot: reminders-03-relaunched

# My schedule › Reminder settings › Back.
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: my_schedule
      NAME: "My schedule.*Tab 3 of 5"
- tapOn:
    id: my_schedule.overflow
- tapOn:
    id: my_schedule.reminder_settings
- extendedWaitUntil:
    visible:
      id: settings.high_contrast
    timeout: 15000
- runFlow: ../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: my_schedule.overflow
    timeout: 15000
- assertNotVisible:
    id: settings.high_contrast

# Off again, as it started.
- runFlow: ../subflows/theme_settings.yaml
- scrollUntilVisible:
    element:
      id: settings.reminders.sessions
    direction: DOWN
- tapOn:
    id: settings.reminders.sessions
- extendedWaitUntil:
    notVisible:
      id: settings.reminders.lead.15
    timeout: 15000
