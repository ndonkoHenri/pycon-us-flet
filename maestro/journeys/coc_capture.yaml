# MASK-01..05 (#762): the CoC incident tool against the local mock, as coc@example.com.
#
# 1. A typed badge code (Grace Sample's, MOCK0002) opens the review; Record says
#    "Incident recorded".
# 2. The result counts down in words and clears 15 s after it shows: the panel says
#    "Ready to scan" again.
# 3. Find by name (Margaret Test), Record, Show email reveals margaret@example.com;
#    the app goes to the background and comes back: the result and the email are gone.
#
# Needs the mock running (maestro/README.md, "Staff flows and the mock"). The mock's seed
# and fake data only.
# Each run records two incidents in the mock's memory, so the counts grow run by run.
appId: io.github.ndonkohenri.confcompanion
name: CoC incident, clear after 15 s and in the background, email hidden
tags:
  - staff
  - coc
---
- runFlow: ../subflows/launch_fresh.yaml

- runFlow:
    file: ../subflows/sign_in_mock.yaml
    env:
      EMAIL: coc@example.com
      PASSWORD: mock-coc
- extendedWaitUntil:
    visible:
      id: more.title
    timeout: 15000
- scrollUntilVisible:
    element:
      id: more.staff.coc
    direction: DOWN
- tapOn:
    id: more.staff.coc
- extendedWaitUntil:
    visible:
      id: coc.directory.reload  # the directory has loaded
    timeout: 30000

# 1. A typed badge code, the review, Record.
- tapOn:
    id: scan.entry
- inputText: MOCK0002:x
- pressKey: Enter  # as a HID scanner ends a code
- extendedWaitUntil:
    visible:
      id: coc.review.notes
    timeout: 15000
- tapOn:
    id: coc.review.notes
- inputText: Hall B, shouted at a volunteer
- tapOn:
    id: coc.review.record
- extendedWaitUntil:
    visible:
      id: scan.result
      text: "(?s)Incident recorded.*Grace Sample.*"
    timeout: 15000
- assertVisible:
    text: "Read .*Clears in .* seconds?"

# 2. It clears 15 s after it shows: the age line reaches 12 to 14 s with the result
#    still there, then the panel says "Ready to scan".
- extendedWaitUntil:
    visible:
      text: "Read 1[2-4] seconds ago. Clears in [1-3] seconds?"
    timeout: 16000
- assertVisible:
    id: scan.result
    text: "(?s)Incident recorded.*"
# Then a pause past the 15 s: a wait for a text that never shows. A wait for "Ready to
# scan" itself failed within 0.5 s on iOS whenever it overlapped the clear (Maestro
# 2.11), while the same wait passed on a still screen.
- extendedWaitUntil:
    visible:
      text: "A text that never shows"
    timeout: 6000
    optional: true
- assertVisible:
    id: scan.result
    text: "(?s)Ready to scan.*"
- assertNotVisible:  # the age line went with the result
    text: "Read .*"

# 3. Find by name, Record, Show email; the background clears it.
- tapOn:
    id: coc.find
- tapOn:
    id: coc.search
- inputText: mar test
- extendedWaitUntil:
    visible:
      id: coc.search.row.0
    timeout: 15000
- tapOn:
    id: coc.search.row.0
- extendedWaitUntil:
    visible:
      id: coc.review.notes
    timeout: 15000
- tapOn:
    id: coc.review.record
- extendedWaitUntil:
    visible:
      id: scan.result
      text: "(?s)Incident recorded.*Margaret Test.*"
    timeout: 15000
- assertNotVisible:
    text: ".*margaret@example.com.*"
- tapOn:
    id: coc.show_email
- extendedWaitUntil:
    visible:
      id: coc.email
      text: Email margaret@example.com
    timeout: 5000
- assertVisible:
    id: coc.show_email
    text: Hide email
- pressKey: Home
- launchApp:
    clearState: false
    stopApp: false
- extendedWaitUntil:
    visible:
      id: scan.result
      text: "(?s)Ready to scan.*"
    timeout: 15000
- assertNotVisible:
    text: ".*margaret@example.com.*"
- assertNotVisible:
    id: coc.show_email
- assertNotVisible:
    id: coc.email
