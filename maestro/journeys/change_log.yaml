# P2 exit criterion 4's change-log half (#460): a schedule change from a served feed
# pair, saved sessions first (NEW-04, D-255).
#
# Needs the feed-pair server running on the laptop, serving the recorded 2026 feed and a
# copy with the saved session moved, and an unsaved one, so the order of the sections
# shows (testing-and-quality.md §9.2):
#
#   uv run python -m tools.feed_pair --move 123 "Room 103ABC" --move 142 "Room 101B"
#
# env (each has a default, for the server's default port, 8460):
#   FEED_URL     the pair's feed URL as the device reaches it: the laptop's loopback is
#                http://10.0.2.2:<port>/conference-2026.json on the Android emulator and
#                http://127.0.0.1:<port>/conference-2026.json on the iOS simulator
#   CONTROL_URL  the server as the laptop reaches it, where Maestro's scripts swap the
#                pair: http://127.0.0.1:<port> on both
#
# The steps: the old feed set in Developer and refreshed (a new feed URL's first feed is
# not diffed: no batch); the panel happening now (session 123, Grand Ballroom B) saved
# on Now; the server swapped to the moved copy, and Refresh now: the SnackBar says
# "1 saved session changed" (the unsaved move is not counted), and Review opens Schedule
# changes, where the saved move is under "Affects My schedule", above "All changes" and
# the unsaved move (talk 142, Grand Ballroom A), and is marked seen after 2 s on iOS; on
# Android, where Maestro makes the app see a screen reader (F72), it still reads "New: "
# on the list and is marked seen when the list is left (ux.md §6.4); My schedule's row
# has the Changed badge, the session its "Moved from" badge; Now has no Schedule changes
# card, its change seen. A screenshot per step (takeScreenshot), in the debug output's
# folder. Both --move edits are needed: without talk 142's, nothing is below
# "All changes".
#
# Not airplane mode, unlike the other journeys: it would cut the emulator's way to the
# laptop too. The launch's own refresh may publish the year's live feed; the feed URL
# change then deletes it and the log (D-255).
appId: io.github.ndonkohenri.pyconus
name: A moved saved session from a feed pair, through the change log
tags:
  - feed_pair
env:
  FEED_URL: "${FEED_URL || (maestro.platform == 'android' ? 'http://10.0.2.2:8460/conference-2026.json' : 'http://127.0.0.1:8460/conference-2026.json')}"
  CONTROL_URL: ${CONTROL_URL || 'http://127.0.0.1:8460'}
---
# The old feed, whatever an earlier run left the server serving.
- runScript:
    file: ../scripts/feed_pair.js
    env:
      SIDE: reset
- assertTrue: ${output.side == 'old'}

# A fresh install at Friday 14:10, on the pair's URL: the first refresh from it
# publishes the old feed, with no batch, so no SnackBar and no Now card.
- runFlow: ../subflows/launch_fresh.yaml
- runFlow:
    file: ../subflows/set_scene.yaml
    env:
      NOW: "2026-05-15 14:10"
      FEED_URL: ${FEED_URL}
      OUTCOME: "Schedule updated from the feed\\."
- assertNotVisible:
    text: "Review"
- assertNotVisible:
    id: now.changes
- takeScreenshot: change_log-01-old-feed

# Save the panel happening now: Now shows it as your next session.
- tapOn:
    id: now.favorite.123
- runFlow: ../subflows/primer_not_now.yaml
- extendedWaitUntil:
    visible:
      id: now.next.session.123
    timeout: 15000
- takeScreenshot: change_log-02-saved

# Swap to the moved copy, and Refresh now: the SnackBar counts the saved session.
- runScript:
    file: ../scripts/feed_pair.js
    env:
      SIDE: swap
- assertTrue: ${output.side == 'new'}
- runFlow: ../subflows/open_developer.yaml
# Refresh now is below the fold on a phone since the Mock API section (#704).
- scrollUntilVisible:
    element:
      id: developer.refresh_now
    direction: DOWN
- tapOn:
    id: developer.refresh_now
# Review at once: without a screen reader the SnackBar goes after 4 s (D-184).
- extendedWaitUntil:
    visible:
      text: "1 saved session changed"
    timeout: 60000
- takeScreenshot: change_log-03-snackbar
- tapOn:
    text: "Review"

# Schedule changes: the move under "Affects My schedule", read as one sentence, new
# until seen (ux.md §6.4).
- extendedWaitUntil:
    visible:
      id: changes.change.123.room
    timeout: 15000
# Saved sessions first: "Affects My schedule" and the saved move above "All changes",
# the unsaved move below it (D-255).
- assertVisible:
    text: "Affects My schedule"
    above:
      id: changes.change.123.room
- assertVisible:
    id: changes.change.123.room
    above:
      text: "All changes"
- assertVisible:
    id: changes.change.142.room
    below:
      text: "All changes"
- assertVisible:
    text: "New: .*room changed from Grand Ballroom B to Room 103ABC\\. In My schedule\\."
- assertVisible:
    text: "New: .*room changed from Grand Ballroom A to Room 101B\\."
- takeScreenshot: change_log-04-review
# iOS: seen after 2 s on the list, so the item no longer reads "New: ".
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Panel: .*room changed from Grand Ballroom B to Room 103ABC\\. In My schedule\\."
          timeout: 15000
      - takeScreenshot: change_log-05-seen
# Android: Maestro makes the app see a screen reader (F72), and with one on the list runs
# no timer and marks the items seen when it is left (ux.md §6.4). So the item still reads
# "New: " after more than 2 s on the list (the optional wait gives the timer it must not
# run 4 s to drop it); step 08's Now, with no Schedule changes card, shows it was seen.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          notVisible:
            text: "New: .*room changed from Grand Ballroom B to Room 103ABC\\. In My schedule\\."
          timeout: 4000
          optional: true
      - assertVisible:
          text: "New: .*room changed from Grand Ballroom B to Room 103ABC\\. In My schedule\\."
      - takeScreenshot: change_log-05-still-new

# Back to Developer, then More; My schedule's row has the Changed badge, which says
# what changed.
- runFlow: ../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: developer.refresh_now
    timeout: 15000
- runFlow: ../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: more.title
    timeout: 15000
- tapOn:
    id: app.nav.my_schedule
- extendedWaitUntil:
    visible:
      id: my_schedule.session.123
    timeout: 15000
- assertVisible:
    id: my_schedule.session.123
    text: ".*Room changed.*Room 103ABC.*"
- takeScreenshot: change_log-06-row-badge

# The session says where it moved from.
- tapOn:
    id: my_schedule.session.123
- extendedWaitUntil:
    visible:
      id: session.changed.room
    timeout: 15000
- assertVisible:
    text: "Moved from Grand Ballroom B"
- takeScreenshot: change_log-07-session-badge

# Back to My schedule, then Now: no Schedule changes card, its change seen.
- runFlow: ../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: my_schedule.title
    timeout: 15000
- tapOn:
    id: app.nav.now
- extendedWaitUntil:
    visible:
      id: now.next.session.123
    timeout: 15000
- assertNotVisible:
    id: now.changes
- takeScreenshot: change_log-08-now-seen
