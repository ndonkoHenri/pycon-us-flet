# EXPO-05 (#406, #454, #643): Map › Expo › List "socal", then search "phemeral" › its
# booth › the expo's List and its line, filtered to the booth.
#
# The Map's expo List is left filtered to "socal" first: the link's List must not keep
# it (#643), so it opens filtered to "139", Phemeral its one row.
#
# Phemeral (Startup Row) has booth 139, which the plan doesn't draw: Places lists
# "Booth 139 · Phemeral", "Not on the map yet". A tap pushes the expo at the booth
# (/search/plan/expo?booth=139); with no booth to select, it opens on the List, under
# the line "Booth 139 isn't on the map yet" (expo.missing), with Phemeral in its
# "Not on the map yet" section. Back returns to the results, the query kept.
#
# Under Maestro on Android the app sees a screen reader (F72) and opens the expo on the
# List; on iOS it opens on the Map. The flow taps List when the field isn't there.
appId: io.github.ndonkohenri.confcompanion
name: Search finds a booth off the plan, and the expo's List says so
tags:
  - journeys
  - expo
onFlowComplete:
  - runFlow: ../subflows/online.yaml
---
- runFlow: ../subflows/start_offline.yaml

# Map › Expo › List, "socal": the filter the link's List must not keep.
- runFlow:
    file: ../subflows/map_tab.yaml
    env:
      TAB: expo
- extendedWaitUntil:
    visible:
      id: expo.view.list
    timeout: 15000
# Either pane's content, so the check below sees a built pane, not a toggle alone (#1136).
- extendedWaitUntil:
    visible:
      id: "expo\\.filter|expo\\.booth\\..*"
    timeout: 15000
- runFlow:
    when:
      notVisible:
        id: expo.filter
    commands:
      - tapOn:
          id: expo.view.list
- tapOn:
    id: expo.filter
- inputText: socal
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: expo.row.726.socal-python
    timeout: 15000

- tapOn:
    id: app.search
- extendedWaitUntil:
    visible:
      id: search.field
    timeout: 15000
# Opened from the Map, search shows Places: the booth is its one place.
- assertVisible:
    id: search.scope.places
    selected: true
- inputText: phemeral
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: search.booth.139.phemeral
    timeout: 15000
# One node: its title's phrase, then the line (`text:` must match the whole label).
- assertVisible:
    id: search.booth.139.phemeral
    text: "Booth 139, Phemeral\\sNot on the map yet"

# → the booth: the List, under its line.
- tapOn:
    id: search.booth.139.phemeral
- extendedWaitUntil:
    visible:
      id: expo.missing
    timeout: 15000
- assertVisible:
    text: Booth 139 isn't on the map yet
- assertVisible:
    id: expo.view.list
    selected: true
# Filtered to the booth, not "socal": Phemeral at the top, no scroll.
- assertVisible:
    id: expo.filter
    text: "139"
- assertVisible:
    id: expo.sponsor.phemeral
- assertNotVisible:
    id: expo.row.726.socal-python

# Back: the results, the query kept.
- runFlow: ../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: search.booth.139.phemeral
    timeout: 15000
- assertVisible:
    id: search.field
    text: phemeral
