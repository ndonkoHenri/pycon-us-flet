# Not filmed: tools/demo_videos.py runs this before the recording starts. Sign in as the
# mock's made-up all-tools account, answer the password sheet and the scanner's consent,
# then stop on More. The sign-in page names the local mock, so it must stay off camera.
appId: io.github.ndonkohenri.confcompanion
---
- tapOn: {id: app.nav.more}
- extendedWaitUntil: {visible: {id: more.sign_in}, timeout: 15000}
- tapOn: {id: more.sign_in}
- tapOn: {id: sign_in.email}
- inputText: all@example.com
- tapOn: {id: sign_in.password}
- inputText: mock-all
- pressKey: Enter
- tapOn: {id: sign_in.submit, optional: true}
- extendedWaitUntil: {visible: {text: Not Now}, timeout: 8000, optional: true}
- tapOn: {text: Not Now, optional: true}
- extendedWaitUntil: {notVisible: {id: sign_in.email}, timeout: 30000}
- extendedWaitUntil: {visible: {id: lead.consent.check}, timeout: 15000}
- tapOn: {id: lead.consent.check}
- tapOn: {id: lead.consent.continue}
- extendedWaitUntil: {visible: {id: scan.result}, timeout: 15000}
- tapOn: {text: Back}
- extendedWaitUntil: {visible: {id: more.title}, timeout: 15000}
