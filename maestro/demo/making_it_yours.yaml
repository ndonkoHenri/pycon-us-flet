# Star the next keynote, its reminder Banner, stars on the Schedule, My schedule's
# overlap warning, an unstar with Undo, and Now again.
appId: io.github.ndonkohenri.confcompanion
---
- runFlow: {file: subflows/pause.yaml, env: {MS: "2500"}}
- tapOn: {id: now.favorite.153}
- extendedWaitUntil: {visible: {id: now.next.session.153}, timeout: 15000}
- runFlow: {file: subflows/pause.yaml, env: {MS: "2000"}}
- extendedWaitUntil: {visible: {id: reminder.banner}, timeout: 70000}
- runFlow: {file: subflows/pause.yaml, env: {MS: "3000"}}
- tapOn: {id: reminder.dismiss}
- runFlow: {file: subflows/pause.yaml, env: {MS: "1200"}}
- tapOn: {id: app.nav.schedule}
- extendedWaitUntil: {visible: {id: schedule.day_tab.2}, timeout: 15000}
- runFlow: {file: subflows/pause.yaml, env: {MS: "2000"}}
- swipe: {start: "50%,75%", end: "50%,35%", duration: 1400}
- runFlow: {file: subflows/pause.yaml, env: {MS: "1000"}}
- extendedWaitUntil: {visible: {id: schedule.favorite.15}, timeout: 15000}
- tapOn: {id: schedule.favorite.4}
- runFlow: {file: subflows/pause.yaml, env: {MS: "1300"}}
- tapOn: {id: schedule.favorite.15}
- runFlow: {file: subflows/pause.yaml, env: {MS: "1500"}}
- tapOn: {id: app.nav.my_schedule}
- extendedWaitUntil: {visible: {id: my_schedule.title}, timeout: 15000}
- runFlow: {file: subflows/pause.yaml, env: {MS: "3500"}}
- tapOn: {id: my_schedule.favorite.15}
- extendedWaitUntil: {visible: {text: "Removed from My schedule"}, timeout: 15000}
- runFlow: {file: subflows/pause.yaml, env: {MS: "1800"}}
- tapOn: {text: Undo}
- extendedWaitUntil: {visible: {id: my_schedule.session.15}, timeout: 15000}
- runFlow: {file: subflows/pause.yaml, env: {MS: "2500"}}
- tapOn: {id: app.nav.now}
- extendedWaitUntil: {visible: {id: now.title}, timeout: 15000}
- runFlow: {file: subflows/pause.yaml, env: {MS: "2500"}}
