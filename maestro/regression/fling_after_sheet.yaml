# #346's row D, repeated: a fling right after "Show N sessions" must run in full.
#
# On #346's branch a fling that started 0.3 to 0.6 s after the filter sheet closed with
# Open space shown was cut short or did not scroll in 11 of 33 tries on the Android
# emulator, against 0 of 18 on main (d1f80f3). This flow repeats that trial, so a build
# can be compared with main's on the same device: install one, run the flow, install the
# other, run it again (maestro/README.md).
#
# env:
#   TRIALS  how many flings after the sheet; default 10
#
# Before the trials, the flow reads where "Show N sessions" leaves the list with no
# fling (the rest), and where the same fling goes from there (the control). Each trial
# then starts on the now slot (Friday 14:10, 2:00 PM), shows Open space through the
# sheet, flings at once, and reads the top row once the list is still
# (scripts/record_fling.js): "moved" when it left the rest's slot, as the control does;
# "short" when it stayed in that slot on another row; "none" when the same row is on
# top. The flow prints each trial (maestro/README.md says where) and fails when any was
# short or none. A trial whose tap missed the button is not counted.
appId: io.github.ndonkohenri.pyconus
name: A fling right after the filter sheet closes runs in full
tags:
  - regression
onFlowComplete:
  - runFlow: ../subflows/online.yaml
---
- runFlow: ../subflows/start_offline.yaml
- tapOn:
    id: app.nav.schedule
- extendedWaitUntil:
    visible:
      id: schedule.session.138
    timeout: 15000
- waitForAnimationToEnd

# The rest: where "Show N sessions" leaves the list, with no fling.
- runFlow: ../subflows/toggle_open_space.yaml
- runFlow: ../subflows/top_slot.yaml
- evalScript: ${output.restRow = output.topRow}
- evalScript: ${output.restSlot = output.topSlot}
# The control: the same fling from the rest, with no sheet just before it.
- swipe:
    start: "50%, 75%"
    end: "50%, 25%"
    duration: 80
- waitForAnimationToEnd
- runFlow: ../subflows/top_slot.yaml
- evalScript: ${output.controlSlot = output.topSlot}
- evalScript: ${console.log('rest at ' + output.restSlot + ', the control fling went to ' + output.controlSlot)}
- assertTrue:
    condition: ${output.controlSlot != output.restSlot}
    label: The control fling, with no sheet, leaves the slot it starts in
# Open space hidden again, back on the now slot.
- runFlow: ../subflows/toggle_open_space.yaml

# "Show N sessions" is tapped by its place, not its identifier: Maestro taps a control
# by its identifier only after reading the screen, then waits for the screen to change,
# about 1 s on the emulator. A swipe that starts and ends on one point is a tap with no
# such waits, so the fling follows it sooner (about 0.9 s on the emulator, Maestro's
# own time between two commands).
- repeat:
    times: ${TRIALS || 10}
    commands:
      - runFlow: ../subflows/to_now.yaml
      - tapOn:
          id: schedule.filter
      - extendedWaitUntil:
          visible:
            id: schedule.filter.open-space
          timeout: 30000
      - tapOn:
          id: schedule.filter.open-space
      - extendedWaitUntil:
          visible:
            id: schedule.filter.show
          timeout: 30000
      # The tap below goes to a place, so the sheet must have finished sliding in.
      - waitForAnimationToEnd
      # Tap "Show N sessions", then fling at once. Maestro takes a swipe's points
      # literally, so each platform has its own (the phones of maestro/README.md).
      - runFlow:
          when:
            platform: Android
          commands:
            - swipe:
                start: "50%, 93%"
                end: "50%, 93%"
                duration: 40
                waitToSettleTimeoutMs: 1
      - runFlow:
          when:
            platform: iOS
          commands:
            - swipe:
                start: "50%, 95%"
                end: "50%, 95%"
                duration: 40
                waitToSettleTimeoutMs: 1
      - swipe:
          start: "50%, 75%"
          end: "50%, 25%"
          duration: 80
      - waitForAnimationToEnd
      # The tap closed the sheet: record where the fling took the list.
      - runFlow:
          when:
            notVisible:
              id: schedule.filter.show
          commands:
            - runFlow: ../subflows/top_slot.yaml
            - runScript: ../scripts/record_fling.js
      # The tap missed (a slow screen, or a phone whose sheet has its button elsewhere:
      # change the point above). The trial is not counted; close the sheet.
      - runFlow:
          when:
            visible:
              id: schedule.filter.show
          commands:
            - evalScript: ${output.missed = (output.missed || 0) + 1}
            - tapOn:
                id: schedule.filter.show
            - extendedWaitUntil:
                notVisible:
                  id: schedule.filter.show
                timeout: 30000
      # Open space hidden again for the next trial.
      - runFlow: ../subflows/toggle_open_space.yaml

- evalScript: ${console.log('flings after the sheet, ' + output.summary + '; taps that missed the button, ' + (output.missed || 0))}
- assertTrue:
    condition: ${output.trial > 0}
    label: At least one trial was counted
- assertTrue:
    condition: ${output.lost == 0}
    label: Every fling after the sheet ran in full
