# S8 throwaway extension (docs/spikes/08-scanner.md): a camera preview that
# reports barcodes, over mobile_scanner pinned exactly. Not app code.
name: flet_s8_scanner
description: S8 spike, a barcode-scanner control for Flet
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  # The build template's dependency_overrides point flet at the pinned
  # checkout, so this constraint is never resolved against pub.dev.
  flet: any
  mobile_scanner: 7.4.2
