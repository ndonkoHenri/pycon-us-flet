# S1 reproducer (docs/spikes/01-packaged-runtime.md): a stub app with our runtime
# stack, built on its own. It uses the repo's .flet-src checkout through relative
# paths, so build it from this folder:
#
#   uv sync
#   uv run flet build apk --arch arm64-v8a --build-number 1
#   uv run flet build ios-simulator --build-number 1
#
# Nothing here is part of the app; src/ of the repo is untouched.

[project]
name = "s1-packaged-runtime"
version = "0.0.1"
description = "S1 spike: the packaged runtime with httpx, zoneinfo, sqlite3 and storage."
requires-python = ">=3.14,<3.15"
dependencies = [                      # bundled by flet build: pin exactly (development.md §2.1)
    "flet",
    "flet-secure-storage",
    "httpx==0.28.1",
    "tzdata==2026.5",
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-web",
    "flet-desktop",
    "flet-platform-assets",
]

[tool.flet]
product = "S1 Runtime"
bundle_id = "io.github.ndonkohenri.pyconus.s1"   # throwaway id, never uploaded

[tool.flet.app]
path = "src"

[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError"

[tool.flet.ios.info]
ITSAppUsesNonExemptEncryption = false

# The same pin as the app (D-81): a source checkout in the repo root's .flet-src.
[tool.uv.sources]
flet = { path = "../../../.flet-src/sdk/python/packages/flet", editable = true }
flet-cli = { path = "../../../.flet-src/sdk/python/packages/flet-cli", editable = true }
flet-web = { path = "../../../.flet-src/sdk/python/packages/flet-web", editable = true }
flet-desktop = { path = "../../../.flet-src/sdk/python/packages/flet-desktop", editable = true }
flet-platform-assets = { path = "../../../.flet-src/sdk/python/packages/flet-platform-assets", editable = true }
flet-secure-storage = { path = "../../../.flet-src/sdk/python/packages/flet-secure-storage", editable = true }

[tool.flet.dev_packages]
flet = "../../../.flet-src/sdk/python/packages/flet"
flet-secure-storage = "../../../.flet-src/sdk/python/packages/flet-secure-storage"
