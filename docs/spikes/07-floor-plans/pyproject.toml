# #361 reproducer (docs/spikes/07-floor-plans.md): do real floor plans with about
# 60 hotspots work in InteractiveViewer on a low-RAM phone? Three tabs (a plain
# list, the Concourse plan, the expo hall with its 61 booths) and a toolbar of the
# options the spike compares. It uses the repo's .flet-src checkout through relative
# paths, so build it from this folder (with a pub cache of its own, D-176):
#
#   uv run --with pillow==12.0.0 python reencode.py --source <Ionic src/assets/img> --out src/assets/plans
#   uv sync
#   uv run flet build apk --arch arm64-v8a --build-number 1
#   uv run flet build ios-simulator --build-number 1
#
# The plans in src/assets/plans/ are generated and not committed (.gitignore).
# Nothing here is part of the app; src/ of the repo is untouched.

[project]
name = "floor-plans-spike"
version = "0.0.1"
description = "#361 spike: floor plans with 61 booths in InteractiveViewer."
requires-python = ">=3.14,<3.15"
dependencies = ["flet"]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-web",
    "flet-desktop",
    "flet-platform-assets",
]

[tool.flet]
product = "S7 Floor plans"
bundle_id = "io.github.ndonkohenri.pyconus.s7plans"   # throwaway id, never uploaded

[tool.flet.app]
path = "src"

[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError"

[tool.flet.ios.info]
ITSAppUsesNonExemptEncryption = false

# The same pin as the app (D-81): a source checkout in the repo root's .flet-src.
[tool.uv.sources]
flet = { path = "../../../.flet-src/sdk/python/packages/flet", editable = true }
flet-cli = { path = "../../../.flet-src/sdk/python/packages/flet-cli", editable = true }
flet-web = { path = "../../../.flet-src/sdk/python/packages/flet-web", editable = true }
flet-desktop = { path = "../../../.flet-src/sdk/python/packages/flet-desktop", editable = true }
flet-platform-assets = { path = "../../../.flet-src/sdk/python/packages/flet-platform-assets", editable = true }

[tool.flet.dev_packages]
flet = "../../../.flet-src/sdk/python/packages/flet"
