# S6 reproducer (docs/spikes/06-reminders.md): scheduled reminders that fire
# while the app isn't running, through a throwaway extension (s6_reminders/)
# over flutter_local_notifications 22.3.1. It uses the repo's .flet-src
# checkout through relative paths, so build it from this folder with a pub
# cache of its own (development.md §5.8):
#
#   uv sync
#   mkdir -p build && { test -d build/pub-cache || cp -cR ~/.pub-cache build/pub-cache; }
#   PUB_CACHE=$PWD/build/pub-cache uv run flet build apk --arch arm64-v8a --build-number 1
#     (fails at checkReleaseAarMetadata until the desugaring patch: see the verdict, U7)
#   PUB_CACHE=$PWD/build/pub-cache uv run flet build ios-simulator --build-number 1
#
# Nothing here is part of the app; src/ of the repo is untouched.

[project]
name = "s6-reminders"
version = "0.0.1"
description = "S6 spike: local reminders while the app isn't running."
requires-python = ">=3.14,<3.15"
dependencies = ["flet", "flet-s6-reminders"]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-web",
    "flet-desktop",
    "flet-platform-assets",
]

[tool.flet]
product = "S6 Reminders"
bundle_id = "io.github.ndonkohenri.pyconus.s6"   # throwaway id, never uploaded

[tool.flet.app]
path = "src"

# The plugin merges POST_NOTIFICATIONS itself; the app states it too (gaps doc §4.1).
# SCHEDULE_EXACT_ALARM is declared only so S6 can compare exact and inexact
# timing, with the permission denied (Android 14's default) and granted.
[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true

[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError"

[tool.flet.ios.info]
ITSAppUsesNonExemptEncryption = false

# The same pin as the app (D-81): a source checkout in the repo root's .flet-src.
[tool.uv.sources]
flet = { path = "../../../.flet-src/sdk/python/packages/flet", editable = true }
flet-cli = { path = "../../../.flet-src/sdk/python/packages/flet-cli", editable = true }
flet-web = { path = "../../../.flet-src/sdk/python/packages/flet-web", editable = true }
flet-desktop = { path = "../../../.flet-src/sdk/python/packages/flet-desktop", editable = true }
flet-platform-assets = { path = "../../../.flet-src/sdk/python/packages/flet-platform-assets", editable = true }
flet-s6-reminders = { path = "s6_reminders", editable = true }

[tool.flet.dev_packages]
flet = "../../../.flet-src/sdk/python/packages/flet"
flet-s6-reminders = "s6_reminders"
