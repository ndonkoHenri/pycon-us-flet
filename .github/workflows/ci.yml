# Lint, type-check and test (D-84, docs/development.md §7.2). While the repo is private it runs only by hand
# (`gh workflow run ci.yml --ref <branch>`): the local checks and the merge gate replace it (D-273). The PR that
# makes the repo public brings back its triggers, every PR and every push to main, and with them the job name as
# the required check for merging (D-100): rename it only together with §7.2.
name: CI

on:
  workflow_dispatch:        # manual runs only while the repo is private (D-273)

permissions:
  contents: read

# Manual runs only (D-273): each run has a group of its own (the run id). With the PR and main triggers back, a new
# push to a PR cancels that PR's older run, and pushes to main keep a group of their own (the run id): a shared
# group would let a newer push replace a pending run on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"            # every uv command fails if uv.lock does not match pyproject.toml

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the app
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.x"         # the uv_build line in pyproject.toml; bump both together
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check
      - name: Cache the pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run the pre-commit hooks
        run: uv run pre-commit run --all-files --hook-stage manual --show-diff-on-failure
      - name: Type-check
        run: uv run pyright
      - name: Test
        run: uv run pytest --hypothesis-profile=ci   # hypothesis's built-in profile, 200 examples via tests/conftest.py
