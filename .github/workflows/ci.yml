# Lint, type-check and test on every PR and push to main (D-84, docs/development.md §7.2).
# The job name is a required check for merging (D-100): rename it only together with §7.2.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push supersedes a PR's older run; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"            # every uv command fails if uv.lock does not match pyproject.toml

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the app
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Until Flet 1.1.0 is on PyPI (D-81, docs/development.md §2.2).
      - name: Read the Flet pin
        id: flet
        run: echo "ref=$(cat .flet-ref)" >> "$GITHUB_OUTPUT"
      - name: Check out Flet at the pin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: flet-dev/flet
          ref: ${{ steps.flet.outputs.ref }}
          path: .flet-src
          sparse-checkout: sdk/python   # uv.lock references every package of this uv workspace
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.x"         # the uv_build line in pyproject.toml; bump both together
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check
      - name: Type-check
        run: uv run pyright
      - name: Test
        run: uv run pytest
