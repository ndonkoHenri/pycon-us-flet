# Spike S9's fallback (#363): the flows in tests/ui on an emulator with KVM. On the spike branch only, never merged.
name: Spike flet test android

on:
  push:
    branches: [test/363-flet-test-linux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-flet-test-android
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  flows:
    name: flet test android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out the app
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.x"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/ghc
          df -h /
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 0
            df -h /
            free -m
            uv run flet test android -d emulator-5554 --tests-dir tests/ui --yes -v
      - name: Upload the flows' screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flows-android-${{ github.run_attempt }}
          path: build/ui
          retention-days: 7
          if-no-files-found: ignore
