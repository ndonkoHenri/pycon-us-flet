# Build the app for the iOS simulator on a macOS runner, with no signing: a check that the native config and the pins
# still build (D-84, D-86, D-484; docs/development.md §7.5). Builds for people stay on the owner's Mac. It isn't a
# required check (§7.2). While the repo is private it runs only by hand, since macOS minutes count ten times (D-273):
# `gh workflow run build-ios-simulator.yml --ref <branch>`.
name: Build iOS simulator

on:
  workflow_dispatch:        # manual runs only while the repo is private (D-273)

permissions:
  contents: read

# A new run for the same ref cancels the older one.
concurrency:
  group: build-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"            # every uv command fails if uv.lock does not match pyproject.toml

jobs:
  build:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out the app
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.x"         # the uv_build line in pyproject.toml; bump both together
          enable-cache: true
      - name: Install
        run: uv sync --locked

      # LANG: CocoaPods and the build's Ruby tools need a UTF-8 locale (maestro/README.md).
      - name: Build for the simulator
        env:
          LANG: en_US.UTF-8
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: uv run flet build ios-simulator --yes -v

      - name: Check the app is there
        run: test -d build/ios-simulator/pycon-us.app
