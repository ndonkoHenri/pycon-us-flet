# Run our parser and the feed invariants on the live public feed (D-84, DEV-08; docs/development.md §7.3).
# It also reports, without failing, whether next year's feed is published.
# While the repo is private it runs only by hand (`gh workflow run feed-check.yml --ref main`), and the same check
# runs locally with `uv run python -m tools.check_feed`: its weekly schedule is dropped (D-273). The PR that makes
# the repo public brings back the schedule (Mondays 06:17 UTC), whose failed runs email the owner as the alert.
name: Feed check

on:
  workflow_dispatch:        # manual runs only while the repo is private (D-273)

permissions:
  contents: read

# One run at a time. Every run checks the same live feed, so a run started while another
# is pending may replace it; a running check is never cancelled, so its result still counts.
concurrency:
  group: feed-check
  cancel-in-progress: false

env:
  UV_LOCKED: "1"            # every uv command fails if uv.lock does not match pyproject.toml

jobs:
  feed:
    name: Parse the public feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.x"         # the uv_build line in pyproject.toml; bump both together
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Check the public feed
        run: uv run python -m tools.check_feed
