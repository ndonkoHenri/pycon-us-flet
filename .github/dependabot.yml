# Dependabot watches what GitHub's own scanners can read. It covers the Actions our workflows use, pinned by commit with
# the release in a comment. The Python side isn't listed: `uv.lock` points Flet at a checkout (`.flet-src`) that isn't in
# the repository, which Dependabot can't resolve, and a phone's bundle isn't read from the lock anyway (docs/development.md
# §7.6). Add `uv` here once the app builds against Flet from PyPI (#1027).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Bump"
    groups:
      actions:
        patterns: ["*"]
