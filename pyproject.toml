[project]
name = "pycon-us"
version = "0.4.0"                     # == pycon_us.__version__ (unit test, D-83)
description = "A conference companion for PyCon US on Android and iOS, built with Python and Flet. Not an official PSF app."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"      # flet build bundles CPython 3.14 (D-82, F19)
dependencies = [                      # bundled into the app by flet build: pin exactly
    "flet==1.1.0.dev4",               # one version for the whole Flet family (development.md §2.2)
    "flet-notifications==1.1.0.dev4", # E3 reminders (D-220)
    "flet-permission-handler==1.1.0.dev4", # permission status and settings (D-61)
    "flet-secure-storage==1.1.0.dev4", # the mock API key and secret (D-49)
    "httpx==0.28.1",                  # the app imports it: without this, phones get what pip finds that day (D-470)
    "tzdata==2026.5",                 # zoneinfo data on phones (D-43)
]

[build-system]                        # uv sync installs pycon_us (src/pycon_us) editable on the host
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [                               # host only, never bundled; versions in uv.lock (D-75)
    "flet-cli==1.1.0.dev4",           # flet run / build / debug / devices / test
    "flet-web==1.1.0.dev4",           # flet run --android/--ios serves through it
    "flet-desktop==1.1.0.dev4",       # optional desktop window (D-09, development.md §5.4)
    "flet-platform-assets==1.1.0.dev4", # flet-cli's dependency, held to the family's version
    "flet[test]==1.1.0.dev4",         # flet test flows (D-78) and pytest-asyncio
    "pytest",
    "pytest-xdist",                   # `-n auto` in ci.yml and tools/check.sh: the tests take 90% of a CI run (D-483)
    "hypothesis",
    "ruff",
    "pre-commit",                     # the hooks of .pre-commit-config.yaml (D-480); tools/check.sh runs them
    "pyright",
    "segno",                          # the mock-badge sheet's QR codes (D-391); never bundled
    "icalendar",                      # reads core/ics.py's files back (D-268); never bundled
    "ical",                           # the stricter reader of the same files (D-268); never bundled
]

# ------------------------------------------------------------------ flet build
[tool.flet]
product = "Conf Companion"            # display name, neutral: no PSF mark (D-36, D-452)
bundle_id = "io.github.ndonkohenri.confcompanion"   # both platforms (D-452)
icon_background = "#680579"           # behind src/assets/icon.svg where a platform needs an opaque icon (D-452)

[tool.flet.app]
path = "src"                          # entry point src/main.py

[tool.flet.deep_linking]              # confcompanion://app/<route path> on both platforms (D-269, D-452)
scheme = "confcompanion"              # lowercase, never http(s) or file
host = "app"                          # iOS registers only the scheme

[tool.flet.splash]                    # SHELL-01: the same purple as BootView, so no flash
color = "#680579"
dark_color = "#680579"

[tool.flet.boot_screen.flet]          # shown while Python starts, between splash and BootView
bgcolor_light = "#680579"
bgcolor_dark = "#680579"

[tool.flet.flutter.pubspec.dependencies] # Roboto 400/500/700 (D-26, D-105); path from build/flutter/
roboto_fonts = { path = "../../flutter_packages/roboto_fonts" }

[tool.flet.android.permission]        # NATIVE-06; the receivers and RECEIVE_BOOT_COMPLETED come with flet-notifications (D-220)
"android.permission.POST_NOTIFICATIONS" = true     # Android 13+; the plugin merges it too, declared so the app says so
"android.permission.SCHEDULE_EXACT_ALARM" = true   # exact reminders when the user allows them; never USE_EXACT_ALARM (D-221)

[tool.flet.android]                   # Auto Backup takes only the preferences file (D-472, development.md §8.1)
res_dir = "android_res"               # android_res/xml/*.xml, from the project root: the backup rules

[tool.flet.android.manifest_application]
allowBackup = "true"                  # said outright, though it is Android's default
fullBackupContent = "@xml/backup_rules"                  # Android 11 and older
dataExtractionRules = "@xml/data_extraction_rules"       # Android 12 and newer

[tool.flet.android.gradle_properties] # fits a standard GitHub runner (template: -Xmx8G)
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError"

[tool.flet.ios]                       # signing (development.md §8.2); not secret (D-86)
team_id = "VF87YBAN84"
# No export_method: the default "debugging" serves flet debug ios; TestFlight builds pass
# --ios-export-method app-store-connect. No provisioning_profile yet (#121): flet build ipa
# then passes --no-codesign and produces an .xcarchive.

[tool.flet.ios.export_methods.debugging]
signing_certificate = "Apple Development"

[tool.flet.ios.export_methods."app-store-connect"]
signing_certificate = "Apple Distribution"
export_options = { manageAppVersionAndBuildNumber = false }   # Xcode must not renumber

[tool.flet.ios.info]
ITSAppUsesNonExemptEncryption = false # HTTPS only: no export-compliance prompt on upload

# ------------------------------------------------------------------ tools
[tool.ruff]
target-version = "py314"              # ruff also skips git-ignored paths (excluded/)
extend-exclude = ["*.md"]             # code sketches in the docs are illustrations, not our code

[tool.ruff.lint]
# ruff 0.17's default set already holds F (pyflakes), the dangerous B, S and BLE rules, ASYNC, PLE and some of PERF and
# RUF; extend-select adds the families below and `ignore` takes out the rules that would fight the code. One comment per
# family says why it is on, one per ignored rule why it is off (D-480, #1028). Not selected at all, and why:
#   ERA  12 hits, all section-heading comments such as `# Escaping (D-115)` that read as calls
#   TC   1,969 hits: moving imports under TYPE_CHECKING breaks Flet's runtime-evaluated annotations and dataclasses
#   PLR  the magic-value, too-many-arguments and too-many-statements rules (about 750 hits) fight `@ft.component`
#        functions, which take many props, and test asserts
extend-select = [
    "I",      # isort: imports in one order
    "UP",     # pyupgrade: the syntax of Python 3.14
    "B",      # bugbear: likely bugs
    "SIM",    # simplify
    "D",      # docstrings (D-74)
    "DTZ",    # no naive datetimes (D-43)
    "E",      # pycodestyle errors; E501 at 120 columns, the length the prose already keeps
    "W",      # pycodestyle warnings
    "C4",     # comprehensions: no needless list() or dict() around one
    "PTH",    # pathlib over os.path and open()
    "PERF",   # performance: a loop that is one extend() or comprehension
    "T20",    # no print() in the app (tools print by design)
    "A",      # builtins: a name that shadows one
    "N",      # PEP 8 naming
    "ARG",    # unused arguments
    "PT",     # pytest style: raises() blocks of one statement, match=, parametrize names
    "ASYNC",  # async functions: blocking calls and busy waits
    "S",      # bandit, for src only: SQL built from strings, weak hashes, passwords in code
    "PLC",    # pylint conventions: split() with maxsplit when only the first part is used
    "PLW",    # pylint warnings: a loop variable reassigned
    "RUF",    # ruff's own: unused noqa, a task nobody holds, regex patterns that are not raw
    "PIE",    # misc. clutter: unneeded pass, range start, dict spread
    "RET",    # return statements: no else after return, no unneeded variable
    "LOG",    # logging: use of the logging module itself
    "G",      # logging calls: lazy %-formatting, no f-strings in the message
    "TID",    # tidy imports: no relative imports from a parent
    "ICN",    # import conventions: `import flet as ft`
    "ISC",    # implicit string concatenation: no accidental joins in a list
    "RSE",    # raise: no parentheses on a bare class
    "FURB",   # refurb: modern idioms of the standard library
    "FLY",    # flynt: no `"".join` of constants where an f-string reads better
]
ignore = [
    "ASYNC109",  # an async helper takes a `timeout` budget as part of its API; asyncio.timeout() inside would hide it
    "N802",      # the Flet idiom: an `@ft.component` function is named like the control it returns, in CamelCase
    "PLC0415",   # imports inside functions are deliberate: native extensions exist only in the packaged app
    "PLW0108",   # `lambda: f()` late-binds on purpose where tests patch `f`
    "PLW0603",   # four process-wide switches (clock, build, error details) are module state by design
    "PT018",     # `assert a and b` is the style of 575 tests, and no bug hides in it
    "RUF001",    # ambiguous Unicode in strings, docstrings and comments (RUF002, RUF003):
    "RUF002",    # the text is deliberately typographic (the ellipsis, en dash, multiplication sign, curly quote)
    "RUF003",
    "S101",      # `assert` narrows a type for pyright in src; the tests are all asserts
    "SIM108",    # at the 120-column limit it asks for nested ternaries that read worse (theme.py)
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120             # code is formatted at ruff's 88; docstrings and comments run to 120

[tool.ruff.lint.per-file-ignores]
# Frozen spike scripts: kept as they ran. E402: sys.path is set up before their imports.
"docs/spikes/**" = ["A", "ARG", "ASYNC", "E402", "E501", "N", "PERF", "PLC", "PLW", "PTH", "S", "T20"]
# Command-line scripts print by design, run adb, node and servers on purpose, and have handler signatures.
"tools/**" = ["ARG", "S", "T20"]
"tools/mock_api/server.py" = ["N815"]        # BaseHTTPRequestHandler wants do_GET, do_POST, ...
"tools/mock_api/state.py" = ["N818"]         # `Refused` is the mock's vocabulary: 63 uses in 11 files, "Refused: 404 ..."
# Tests: fakes copy the signatures they stand in for (id, format); fixtures and callbacks have fixed signatures;
# polling helpers wait in a loop and tmp_path files are small; asserts and fake keys are the point.
"tests/**" = ["A002", "ARG", "ASYNC110", "ASYNC240", "S"]
"tests/ui/**" = ["T20"]                      # device flows report on stdout
"src/pycon_us/screens/wifi.py" = ["S105"]            # the labels of a Wi-Fi password row, not passwords
"src/pycon_us/services/credentials.py" = ["S105"]    # the names of the secure-storage keys, not secrets
"src/pycon_us/services/outbox_*.py" = ["S608"]       # SQL built from column lists and ? placeholders; every value is bound

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests", "tools"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"                 # async client tests (testing-and-quality.md §2)
testpaths = ["tests"]
pythonpath = ["."]                    # tools.mock_api; pycon_us is installed by uv sync
addopts = ["--ignore=tests/ui"]       # device flows run through flet test (D-78)
