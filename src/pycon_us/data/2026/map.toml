# PyCon US 2026: the venue's floor plans and the pins on them (D-45, DATA-32, MAP-07).
# Loaded by pycon_us.config.load_year() through pycon_us.year_map.
#
# Plans: the images are under src/assets/, made by tools/encode_plans.py from the Ionic
# app's plans (2048 px, lossy WebP 80, and an 800-px thumbnail; D-312; credited in NOTICE,
# D-87). width and height are the image's, as the script prints them. The campus plan's
# PyCon wordmark and the venue's logo, and the expo plan's sun-and-palms mark, are painted
# over (D-36). In the Map's order; "expo" is the plan the booths are on.
#
# Pins: one table for rooms and venue spots. A room's key is normalize_room_key() of its
# feed name (core/slugs.py), so "Room 102A" and "102A" find the same pin; a venue spot's
# key has a hyphen, which no room key has, and Venue & hours names it (content.toml's
# venue_hours pin). x and y are percent of the plan, from Ionic's tables (ROOM_LOCATIONS,
# VENUE_LOCATIONS), and land on the thumbnail too. sprint marks the rooms the sprints
# use (MAP-08). A feed room without a pin, and not under content.toml's other_locations,
# fails tests/test_year_map.py.
#
# Booths (EXPO-02, D-254): Ionic's 61 booth rectangles (expo-hall-map.component.ts), turned
# once from pixels of its 9931 x 7021 reference into ratios of the plan (x, y, w, h, 0-1),
# by number. number is the feed's booth_number, as text. A booth lists every sponsor with
# its number; label names only a booth the feed gives no exhibitor. 2026's gaps, pinned by
# tests/test_expo.py: booths 139 and 336 have sponsors but no rectangle, 407 and 606 a
# rectangle but no sponsor.

tour_url = "https://map.concept3d.com/?id=1802"   # the venue's 3D tour (Ionic's "3D Tour")

