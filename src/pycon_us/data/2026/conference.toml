# PyCon US 2026: the facts the app needs about this year (D-45).
# Loaded by pycon_us.config.load_year(); the dataclasses there are the schema, with
# the track registry's in pycon_us.year_tracks (D-228).
# Source: https://us.pycon.org/2026/ (checked 2026-10-12).

year = 2026
name = "PyCon US 2026"
time_zone = "America/Los_Angeles"   # IANA zone; every time is shown in it (D-43)
time_zone_name = "Pacific Time"      # shown when the device zone differs (D-35)
first_day = 2026-05-13              # tutorials
last_talk_day = 2026-05-17          # the last day of the main conference
last_day = 2026-05-19               # the last sprint day
venue = "Long Beach Convention Center"
city = "Long Beach, CA"
# The venue's address and the point Directions opens a maps app at (MAP-11, D-313).
# Optional. The address is the feed's `venues-hours` block's; the point, [directions]
# below, is the Pine Ave entrance Ionic sent attendees to, which OpenStreetMap puts at
# the convention center's west end, 300 E Ocean Blvd (nominatim.openstreetmap.org
# reverse lookup, checked 2026-10-21).
address = "300 E Ocean Blvd, Long Beach, CA 90802"
site_url = "https://us.pycon.org/2026/"
feed_url = "https://us.pycon.org/2026/schedule/conference.json"
# Where attendees check their registration and add tutorials and summits to it; session
# detail links it for sessions that need registration (SESS-01). Optional. Source:
# https://us.pycon.org/2026/attend/information/ (checked 2026-10-13).
registration_url = "https://us.pycon.org/2026/accounts/dashboard/"
# The development sprints' page and where a project signs up for them, for the Sprints
# page's menu (EVT-08). Optional. Source: Ionic's Sprints page, checked on
# us.pycon.org (2026-10-13).
sprints_url = "https://us.pycon.org/2026/events/dev-sprints/"
sprint_submit_url = "https://us.pycon.org/2026/sprints/project/submit/"
# The public page a speaker joins the speakers' Discord from, which the Account page
# opens for a speaker account in the in-app browser (AUTH-10, D-411): a web page that
# uses the browser's us.pycon.org session, never an /api/v1 call (D-51). Optional.
# Source: Ionic's account.ts, openSpeakerDiscord().
speaker_discord_url = "https://us.pycon.org/2026/speaker/join_discord/"
# When the bundled snapshot, conference.json, was fetched (D-38, NEW-03). Written by
# tools/update_snapshot.py; the status strip (P1) shows the data's age from it.
snapshot_captured_at = 2026-10-11T17:56:49-07:00

[directions]
label = "Long Beach Convention Center (Pine Ave Entrance)"
latitude = 33.764444
longitude = -118.191722

# The track registry (DATA-14, DATA-28). `key` is the track as feed processing names it:
# the feed's kind with its first letter upper-cased (`sponsor-workshop` becomes
# `Sponsor Presentation`). `short` names a badge or a row, `plural` a list of the
# track's sessions, `long` the track on session detail. `icon` is an outlined Material
# icon (an ft.Icons name, D-27); `group` places it in the filter sheet: talks,
# hands-on, community or logistics. Colours live in the theme tokens (D-24, D-25).
# `slug` is the track page's segment in /more/tracks/<slug>, written out rather than
# derived from the key (DATA-29: `ai`, not Ionic's `ais`); `legend` says in one line
# what its sessions are (EVT-04); `new = true` marks a track new this year (SCHED-21).
# An unknown key falls back to its humanised form (config.ConferenceInfo.track), with
# no page.

[[tracks]]
key = "Talk"
short = "Talk"
plural = "Talks"
long = "Talk"
icon = "MIC_NONE_OUTLINED"
group = "talks"
slug = "talks"
legend = "Talks of 30 to 45 minutes on a wide range of Python topics"

