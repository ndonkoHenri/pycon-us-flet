# The conference moments written by hand (NOTIF-05, D-274): reminders at fixed times that
# no feed knows about, ids 8000-8049. The keynotes' and panels' moments are not here: the
# app derives them from the feed, 15 min before each starts (ids 8050-8099), so a keynote
# the schedule moves takes its moment along. Each entry names the public page it was said
# from and when that was checked. The pages give the days, not the hours, so `at` is our
# choice and no text names a clock time:
# - lightning talks: sign-ups are on the site during the conference, and speakers are
#   picked at lunchtime for that evening's or the next morning's talks, so Saturday's
#   lunch picks the last ones; the moments come before lunch on Friday and Saturday;
# - open spaces: each day's sign-ups open the day before, from Thursday; the moments come
#   at the end of the afternoon before each day of talks.
[[event_reminders]]
id = 8000
category = "open_space"
at = 2026-05-14T17:00:00-07:00
title = "Open space sign-ups for Friday"
body = "Host an hour on any topic: each day's open spaces take sign-ups from the day before."
route = "/more/open-spaces"
source = "https://us.pycon.org/2026/events/open-spaces/"
checked = 2026-10-20

