name: roboto_fonts
description: Roboto 400/500/700 (Apache-2.0, googlefonts/roboto v2.138) for the app (D-26).
version: 0.0.1
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
flutter:
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
